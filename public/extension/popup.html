<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4f46e5, #0284c7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
    }
    .subtitle {
      font-size: 10px;
      color: #64748b;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #047857;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      width: 100%;
      box-sizing: border-box;
      justify-content: center;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">⚡</div>
    <div>
      <div class="title">Lynqly Companion</div>
      <div class="subtitle">Data Acquisition Sync</div>
    </div>
  </div>
  <div class="badge">
    <span class="dot"></span> Active & Synced to Admin Panel
  </div>
</body>
</html>
